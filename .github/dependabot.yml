# Weekly update PRs for npm packages and GitHub Actions. Each runs through the same checks as any
# other pull request.
#
# npm minor and patch updates are grouped, so a week brings two PRs that normally pass together. A
# major update gets a PR of its own: grouped with the rest, one breaking change (zod 3 to 4 was the
# first) blocks every harmless update behind it.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The default of 5 is shared by the group PRs and every major, so majors queued behind them.
    open-pull-requests-limit: 10
    groups:
      # Vitest and its plugins only work at the same major version, so they move together, majors
      # included. Listed first: a package joins the first group it matches.
      vitest:
        patterns: ['vitest', '@vitest/*']
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The types must match the oldest supported runtime (package.json engines: node >=22).
      # Newer ones would let code use APIs that crash on Node 22 without a type error.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Action majors have so far been drop-in, and every workflow runs on the update PR itself.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
