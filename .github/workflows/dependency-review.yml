# Judge the dependencies a pull request adds or changes, rather than all of them (that is what
# `npm audit` in ci.yml does). calmcp is MIT and ships its dependencies inside the .mcpb bundle and
# the Docker image, so a new copyleft license matters as much as a new vulnerability.

name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lets the action explain a failure in a PR comment.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0
          # node-forge is "BSD-3-Clause OR GPL-2.0"; calmcp uses it under BSD-3-Clause.
          allow-dependencies-licenses: pkg:npm/node-forge
